<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>ATELIER | Elegant Video Showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Italianno&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* Light & Dark mode variables */
    :root {
      --bg-primary: #0B0A0A;
      --bg-secondary: rgba(11, 10, 10, 0.85);
      --text-primary: #EDEAE4;
      --text-secondary: #B8AA9A;
      --text-muted: #9E8F7C;
      --border-glow: rgba(219, 198, 165, 0.2);
      --card-bg: rgba(20, 18, 17, 0.55);
      --accent-gold: #DBC6A5;
      --accent-gold-light: #E8D7BE;
      --accent-gold-dark: #B89B72;
      --footer-text: #5e5548;
      --btn-hover: #DBC6A5;
      --btn-hover-text: #0B0A0A;
      --dialog-bg: rgba(25,23,22,0.98);
      --choice-bg: rgba(30, 28, 27, 0.7);
      --icon-filter: brightness(0) invert(1);
      --input-bg: rgba(0, 0, 0, 0.5);
      --shadow-color: rgba(219, 198, 165, 0.2);
      --brand-color: transparent;
      --arrow-btn-bg: rgba(20, 18, 17, 0.5);
      --overlay-gradient: linear-gradient(135deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.35) 100%);
    }

    body.light-mode {
      --bg-primary: #F5F0E8;
      --bg-secondary: rgba(245, 240, 232, 0.95);
      --text-primary: #2C241E;
      --text-secondary: #4A3F35;
      --text-muted: #7A6A5A;
      --border-glow: rgba(90, 70, 50, 0.2);
      --card-bg: rgba(255, 250, 240, 0.9);
      --accent-gold: #A0784C;
      --accent-gold-light: #C4A16E;
      --accent-gold-dark: #7D5D3A;
      --footer-text: #8B7355;
      --btn-hover: #A0784C;
      --btn-hover-text: #FFFFFF;
      --dialog-bg: rgba(255, 252, 245, 0.98);
      --choice-bg: rgba(245, 238, 228, 0.85);
      --icon-filter: brightness(0) saturate(100%) invert(0);
      --input-bg: rgba(200, 185, 165, 0.25);
      --shadow-color: rgba(100, 70, 40, 0.15);
      --brand-color: #1A1613;
      --arrow-btn-bg: rgba(160, 120, 76, 0.2);
      --overlay-gradient: linear-gradient(135deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.05) 100%);
    }

    body {
      background: var(--bg-primary);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), color 0.3s ease;
    }
    
    .image-backdrop { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: -1; 
      overflow: hidden; 
      background: #000; 
    }
    .bg-video { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s ease; opacity: 1; will-change: opacity; }
    .image-backdrop::after { 
      content: ""; 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: var(--overlay-gradient); 
      pointer-events: none; 
      z-index: 1; 
      transition: background 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }
    
    html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
    
    ::selection { background: var(--accent-gold); color: #0B0A0A; }
    
    /* Navigation Bar */
    .site-header { 
      padding: 0.7rem 1.2rem; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      gap: 0.6rem; 
      background: var(--bg-secondary); 
      backdrop-filter: blur(16px); 
      border-bottom: 1px solid var(--border-glow); 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      z-index: 1000; 
      transition: background 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), border-color 0.3s ease;
    }
    .brand-name { 
      font-size: 1.6rem; 
      font-weight: 400; 
      font-family: 'Italianno', cursive; 
      letter-spacing: 1px; 
      background: linear-gradient(135deg, #F5E7D3, var(--accent-gold-light)); 
      background-clip: text; 
      -webkit-background-clip: text; 
      color: transparent; 
    }
    body.light-mode .brand-name { 
      background: none; 
      background-clip: unset; 
      -webkit-background-clip: unset; 
      color: #1A1613; 
    }
    
    .nav-links { display: flex; gap: 0.9rem; align-items: center; flex-wrap: wrap; }
    .nav-btn { 
      background: none; 
      border: none; 
      font-family: 'Inter', sans-serif; 
      font-size: 0.75rem; 
      font-weight: 500; 
      color: var(--text-secondary); 
      cursor: pointer; 
      transition: color 0.3s ease, transform 0.2s ease; 
      padding: 0.3rem 0; 
      position: relative; 
      white-space: nowrap;
    }
    .nav-btn:hover { color: var(--accent-gold); transform: translateY(-1px); }
    .nav-btn::after { 
      content: ''; 
      position: absolute; 
      bottom: -2px; 
      left: 0; 
      width: 0; 
      height: 1px; 
      background: var(--accent-gold); 
      transition: width 0.3s ease; 
    }
    .nav-btn:hover::after { width: 100%; }
    
    .theme-toggle {
      background: transparent;
      border: none;
      font-size: 0.7rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.3s ease;
      padding: 0.2rem 0.4rem;
    }
    .theme-toggle:hover { color: var(--accent-gold); background: transparent; }
    
    /* MAIN APP WRAPPER */
    .app-wrapper { 
      display: flex; 
      flex-direction: column; 
      min-height: 100vh; 
      position: relative; 
      z-index: 10; 
      padding-top: 70px;
      justify-content: space-between;
    }
    
    .top-nav-bar { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0.8rem 1.5rem; 
      background: transparent; 
      width: 100%;
    }
    .product-name-small { 
      font-size: 0.9rem; 
      font-weight: 400; 
      letter-spacing: 0.5px; 
      color: var(--text-secondary); 
      text-transform: uppercase; 
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      padding: 0.25rem 1rem;
      border-radius: 40px;
      display: inline-block;
    }
    .arrows-group { display: flex; gap: 0.8rem; }
    .arrow-btn { 
      background: var(--arrow-btn-bg); 
      backdrop-filter: blur(8px); 
      border: 1px solid var(--border-glow); 
      border-radius: 40px; 
      width: 42px; 
      height: 42px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); 
      font-size: 1.3rem; 
      color: var(--text-secondary); 
    }
    .arrow-btn:hover { background: rgba(219,198,165,0.35); border-color: var(--accent-gold); color: var(--accent-gold); transform: translateY(-2px); }
    
    .elegant-footer { 
      margin-top: auto; 
      text-align: center; 
      padding: 1.2rem 1rem 1.8rem; 
      background: linear-gradient(to top, var(--bg-secondary), transparent); 
      width: 100%;
    }
    .price-display { 
      font-size: 1.8rem; 
      font-weight: 500; 
      color: var(--accent-gold); 
      display: inline-block; 
      margin-bottom: 0.3rem; 
    }
    .gold-line { 
      width: 50px; 
      height: 1px; 
      background: var(--accent-gold); 
      margin: 0.2rem auto 0.4rem; 
      opacity: 0.8; 
    }
    .buy-btn { 
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
      border: 1.5px solid var(--accent-gold); 
      border-radius: 60px; 
      padding: 0.6rem 1.8rem; 
      font-family: 'Inter', sans-serif; 
      font-size: 0.85rem; 
      font-weight: 600; 
      color: var(--text-primary); 
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); 
      margin-top: 0.8rem; 
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .buy-btn:hover { background: var(--accent-gold); color: #0B0A0A; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.2); }
    body.light-mode .buy-btn:hover { color: #FFFFFF; }
    
    /* Modal styles */
    .modal-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.85); 
      backdrop-filter: blur(12px); 
      z-index: 2000; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      opacity: 0; 
      visibility: hidden; 
      transition: all 0.3s ease; 
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-card { 
      background: var(--card-bg); 
      backdrop-filter: blur(16px); 
      border: 1px solid var(--border-glow); 
      border-radius: 32px; 
      padding: 1.6rem; 
      max-width: 560px; 
      width: 92%; 
      max-height: 85vh; 
      overflow-y: auto; 
      position: relative; 
    }
    .modal-card h2 { margin-bottom: 0.8rem; color: var(--accent-gold); font-weight: 600; font-size: 1.4rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; margin-bottom: 0.3rem; color: var(--accent-gold); font-size: 0.75rem; font-weight: 500; }
    .form-group input { width: 100%; padding: 0.7rem 0.9rem; background: var(--input-bg); border: 1px solid var(--border-glow); border-radius: 16px; color: var(--text-primary); font-family: inherit; font-size: 0.85rem; }
    .form-group input:focus { outline: none; border-color: var(--accent-gold); box-shadow: 0 0 0 2px var(--shadow-color); }
    .modal-btn { background: var(--accent-gold); color: #0B0A0A; border: none; padding: 0.75rem; border-radius: 60px; cursor: pointer; font-weight: 700; width: 100%; margin-top: 1rem; transition: all 0.3s ease; font-size: 0.9rem; }
    body.light-mode .modal-btn { color: #FFFFFF; }
    .instapay-payment-btn { background: linear-gradient(135deg, #20B2AA, #128C7E); color: white; border: none; padding: 0.85rem; border-radius: 60px; cursor: pointer; font-weight: 700; width: 100%; margin-top: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
    .payment-section { background: rgba(0,0,0,0.25); border-radius: 24px; padding: 1rem; margin-top: 1rem; text-align: center; border: 1px solid var(--border-glow); }
    .close-modal { position: absolute; top: 12px; right: 18px; background: none; border: none; color: var(--accent-gold); font-size: 1.8rem; cursor: pointer; }
    .custom-dialog-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 3000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
    .custom-dialog-overlay.active { opacity: 1; visibility: visible; }
    .custom-dialog { background: var(--dialog-bg); border: 1px solid var(--accent-gold); border-radius: 32px; padding: 1.8rem; max-width: 400px; width: 88%; text-align: center; }
    .custom-dialog h3 { color: var(--accent-gold); margin-bottom: 0.6rem; }
    .custom-dialog p { color: var(--text-secondary); margin-bottom: 1.3rem; font-size: 0.9rem; }
    .custom-dialog button { background: var(--accent-gold); border: none; padding: 0.6rem 1.5rem; border-radius: 40px; font-weight: 600; cursor: pointer; }
    
    @media (max-width: 550px) {
      .site-header { padding: 0.6rem 0.9rem; }
      .brand-name { font-size: 1.3rem; }
      .nav-btn { font-size: 0.68rem; }
      .nav-links { gap: 0.6rem; }
      .app-wrapper { padding-top: 62px; }
      .top-nav-bar { padding: 0.5rem 1rem; }
      .arrow-btn { width: 38px; height: 38px; font-size: 1.1rem; }
      .price-display { font-size: 1.5rem; }
      .buy-btn { padding: 0.5rem 1.4rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
<div class="image-backdrop" id="videoBackdrop">
  <video id="bgVideo" class="bg-video" muted autoplay loop playsinline preload="metadata"></video>
</div>
<div class="custom-dialog-overlay" id="globalDialog"><div class="custom-dialog"><h3 id="dialogTitle">Notice</h3><p id="dialogMessage"></p><button id="dialogConfirmBtn">OK</button></div></div>

<div class="site-header">
  <div class="brand-name">DigitalVows</div>
  <div class="nav-links">
    <button class="nav-btn" onclick="window.location.href='index.html#home'">Home</button>
    <button class="nav-btn" onclick="window.location.href='index.html#about'">About</button>
    <button class="nav-btn" onclick="window.location.href='index.html#services'">Services</button>
    <button class="nav-btn" onclick="window.location.href='index.html#contact'">Contact</button>
    <div class="theme-toggle" id="themeToggleBtn">LIGHT</div>
  </div>
</div>

<div class="app-wrapper">
  <div class="top-nav-bar">
    <div class="product-name-small" id="productNameSmall">Style 1</div>
    <div class="arrows-group">
      <button class="arrow-btn" id="prevArrow">←</button>
      <button class="arrow-btn" id="nextArrow">→</button>
    </div>
  </div>
  <footer class="elegant-footer">
    <div class="price-display" id="priceText">$250</div>
    <div class="gold-line"></div>
    <button class="buy-btn" id="buyNowBtn"> Buy Now</button>
  </footer>
</div>
<div id="orderModal" class="modal-overlay">
  <div class="modal-card">
    <button class="close-modal" id="closeModalBtn">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
  // ========== VIDEOS WITH FULL AUDIO (NO MUTE BUTTON, VIDEOS UNMUTED BY DEFAULT) ==========
  // We want videos to play with their original audio. However, modern browsers block autoplay with sound.
  // To comply with browser policies while delivering the desired experience, we:
  // 1. Set video to NOT be muted initially, BUT browsers will block autoplay if not muted.
  // 2. We'll use a one-time user interaction (any click on the page) to unlock audio and play with sound.
  // This ensures that after the first user interaction, all videos will have sound.
  // The user never has to find a mute/unmute button - the experience is "audio on after first tap".
  
  const bgVideo = document.getElementById("bgVideo");
  let audioUnlocked = false;
  
  // Function to unlock audio and ensure video plays with sound
  function unlockAudioAndPlay() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    
    // Unmute the video
    bgVideo.muted = false;
    // Set volume to a comfortable level
    bgVideo.volume = 0.85;
    
    // Attempt to play if paused
    if (bgVideo.paused) {
      bgVideo.play().catch(err => console.warn("Play after unlock:", err));
    }
    
    // Remove the event listeners after unlocking
    document.removeEventListener('click', unlockAudioAndPlay);
    document.removeEventListener('touchstart', unlockAudioAndPlay);
    document.removeEventListener('keydown', unlockAudioAndPlay);
  }
  
  // Set initial state: video is muted to allow autoplay, but we'll unlock on first interaction
  bgVideo.muted = true;
  bgVideo.volume = 0.85;
  
  // Add event listeners for first user interaction to enable sound
  document.addEventListener('click', unlockAudioAndPlay);
  document.addEventListener('touchstart', unlockAudioAndPlay);
  document.addEventListener('keydown', unlockAudioAndPlay);
  
  // Also handle visibility changes to keep audio consistent
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && bgVideo.paused) {
      bgVideo.play().catch(e => console.log("visibility resume"));
    }
  });
  
  // ========== DARK/LIGHT MODE ==========
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  const applyTheme = (theme) => {
    if (theme === 'light') {
      document.body.classList.add('light-mode');
      if (themeToggleBtn) themeToggleBtn.innerText = 'DARK';
    } else {
      document.body.classList.remove('light-mode');
      if (themeToggleBtn) themeToggleBtn.innerText = 'LIGHT';
    }
  };
  const savedTheme = localStorage.getItem('digitalvows-theme');
  if (savedTheme === 'light') applyTheme('light');
  else if (savedTheme === 'dark') applyTheme('dark');
  else {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (!prefersDark) { applyTheme('light'); localStorage.setItem('digitalvows-theme', 'light'); }
    else { applyTheme('dark'); localStorage.setItem('digitalvows-theme', 'dark'); }
  }
  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', () => {
      if (document.body.classList.contains('light-mode')) {
        applyTheme('dark');
        localStorage.setItem('digitalvows-theme', 'dark');
      } else {
        applyTheme('light');
        localStorage.setItem('digitalvows-theme', 'light');
      }
    });
  }

  // ---------- FIREBASE INIT ----------
  const firebaseConfig = { 
    apiKey: "AIzaSyDEnumhUfiYWvdGUIC1PEYbx7YgwRml_yc", 
    authDomain: "digitalvows.firebaseapp.com", 
    projectId: "digitalvows", 
    storageBucket: "digitalvows.firebasestorage.app", 
    messagingSenderId: "981576681165", 
    appId: "1:981576681165:web:73498f764062de4e0a4b84" 
  };
  firebase.initializeApp(firebaseConfig); 
  const db = firebase.firestore();
  const MAIN_DOC_ID = "digitalvows_main";
  const ordersCollectionPath = `app_data/${MAIN_DOC_ID}/orders`;
  const INSTAPAY_PAYMENT_LINK = "https://ipn.eg/S/y.elesawi/instapay/3S1OfJ";

  // ---------- VIDEO CATALOG (with full audio) ----------
  const catalog = [
    { name: "Style 1", price: 250, video: "templates/style1.mp4" },
    { name: "Style 2", price: 275, video: "templates/style2.mp4" },
    { name: "Style 3", price: 300, video: "templates/style3.mp4" },
    { name: "Style 4", price: 325, video: "templates/style4.mp4" }
  ];

  let currentIdx = 0;
  let currentOrderCode = null;
  let orderCompleted = false;

  const productNameSpan = document.getElementById("productNameSmall");
  const priceSpan = document.getElementById("priceText");
  const modal = document.getElementById("orderModal");
  const modalContent = document.getElementById("modalContent");
  const dialogOverlay = document.getElementById("globalDialog");
  const dialogMsg = document.getElementById("dialogMessage");
  const dialogTitle = document.getElementById("dialogTitle");
  const dialogConfirm = document.getElementById("dialogConfirmBtn");

  function showGraphicDialog(message, title = "Notice") {
    dialogTitle.innerText = title;
    dialogMsg.innerText = message;
    dialogOverlay.classList.add("active");
    return new Promise((resolve) => {
      const handler = () => { 
        dialogOverlay.classList.remove("active"); 
        dialogConfirm.removeEventListener("click", handler); 
        resolve(); 
      };
      dialogConfirm.addEventListener("click", handler, { once: true });
    });
  }

  let isTransitioning = false;
  function setBackgroundVideo(videoPath) {
    if (isTransitioning) return;
    isTransitioning = true;
    bgVideo.style.transition = "opacity 0.4s ease";
    bgVideo.style.opacity = "0";
    
    setTimeout(() => {
      const wasMuted = bgVideo.muted;
      const wasUnlocked = audioUnlocked;
      
      if (bgVideo.src && bgVideo.src.includes(encodeURIComponent(videoPath))) {
        if (bgVideo.paused) bgVideo.play().catch(e => console.log("autoplay attempt"));
        bgVideo.style.opacity = "1";
        isTransitioning = false;
        return;
      }
      
      bgVideo.src = videoPath;
      bgVideo.load();
      // Preserve the current mute state (initially muted until user interaction)
      bgVideo.muted = wasMuted;
      bgVideo.play().then(() => {
        bgVideo.style.opacity = "1";
        isTransitioning = false;
      }).catch(err => {
        console.warn("Video autoplay blocked:", err);
        bgVideo.style.opacity = "1";
        isTransitioning = false;
      });
      setTimeout(() => {
        if (isTransitioning) {
          bgVideo.style.opacity = "1";
          isTransitioning = false;
        }
      }, 300);
    }, 150);
  }

  function preloadVideo(url) { 
    if(!url) return; 
    const link = document.createElement('link'); 
    link.rel = 'preload'; 
    link.as = 'video'; 
    link.href = url; 
    document.head.appendChild(link); 
    const preVid = document.createElement('video'); 
    preVid.preload = 'auto'; 
    preVid.src = url; 
    preVid.load(); 
  }
  
  function updateDisplay(index) {
    const item = catalog[index];
    if (!item) return;
    productNameSpan.textContent = item.name;
    priceSpan.textContent = `$${item.price}`;
    setBackgroundVideo(item.video);
    const nextIdx = (index + 1) % catalog.length;
    const prevIdx = (index - 1 + catalog.length) % catalog.length;
    preloadVideo(catalog[nextIdx].video);
    preloadVideo(catalog[prevIdx].video);
  }
  
  function nextProduct() { currentIdx = (currentIdx+1)%catalog.length; updateDisplay(currentIdx); }
  function prevProduct() { currentIdx = (currentIdx-1+catalog.length)%catalog.length; updateDisplay(currentIdx); }

  // ---------- MODAL ORDER LOGIC ----------
  function showVerifyScreen() {
    if(orderCompleted){ showGraphicDialog("Order already completed.", "Info"); modal.classList.remove('active'); return; }
    modalContent.innerHTML = `
      <h2>Complete Your Order</h2>
      <div style="color:var(--text-muted); margin-bottom:0.8rem;">Enter your unique code</div>
      <div class="form-group"><label>Order Code</label><input type="text" id="verifyCode" placeholder="Vows-XXXXXX"></div>
      <button class="modal-btn" id="verifyCodeBtn">Verify →</button>
      <div id="verifyError" style="color:#E8A0A0; margin-top:0.8rem; display:none;">Invalid code.</div>
    `;
    document.getElementById('verifyCodeBtn').addEventListener('click', verifyCode);
  }
  
  async function verifyCode() {
    const code = document.getElementById('verifyCode').value.trim();
    if(!code) { showGraphicDialog("Please enter an order code.", "Input Required"); return; }
    try {
      const orderRef = db.doc(`${ordersCollectionPath}/${code}`);
      const doc = await orderRef.get();
      if (!doc.exists) { document.getElementById('verifyError').style.display = 'block'; showGraphicDialog("Invalid code. No order found.", "Verification Failed"); return; }
      const data = doc.data();
      if (data.status === 'completed') { orderCompleted = true; await showGraphicDialog("This order code has already been completed.", "Code Used"); modal.classList.remove('active'); return; }
      if (data.status === 'admin_pending') { await showGraphicDialog("Order pending admin approval. For inquiries: Instagram @digitalvows", "Order In Progress"); modal.classList.remove('active'); return; }
      currentOrderCode = code;
      showOrderDetails(data);
    } catch (err) { await showGraphicDialog('Error: ' + err.message, "Error"); }
  }
  
  function showOrderDetails(orderData) {
    let summaryHtml = `<div style="background:rgba(219,198,165,0.12); border-radius:20px; padding:0.9rem; margin:0.8rem 0;"><strong>Code:</strong> ${currentOrderCode}<br>`;
    let customizationTotal = 0;
    if(orderData.customizationData){
      const c = orderData.customizationData;
      summaryHtml += `<strong>Customization:</strong><br>• Intro: ${c.intro?.name||'-'}<br>• Background: ${c.background?.name||'-'}<br>• Music: ${c.music?.name||'-'}<br>`;
      if(c.intro?.price) customizationTotal += c.intro.price;
      if(c.background?.price) customizationTotal += c.background.price;
      if(c.music?.price) customizationTotal += c.music.price;
      summaryHtml += `<strong>Custom Total:</strong> +$${customizationTotal}</div>`;
    } else { summaryHtml += `<strong>Package:</strong> Standard Invitation</div>`; }
    const selectedStylePrice = catalog[currentIdx].price;
    const totalAmount = selectedStylePrice + customizationTotal;
    summaryHtml += `<div style="background:rgba(219,198,165,0.08); padding:0.6rem; border-radius:14px; margin:0.8rem 0;"><strong>Style:</strong> ${catalog[currentIdx].name} — Base $${selectedStylePrice}<br><strong>Total Due:</strong> <span style="color:var(--accent-gold); font-weight:700;">$${totalAmount}</span></div>`;
    modalContent.innerHTML = `
      <h2>Order Details</h2>
      ${summaryHtml}
      <div class="form-group"><label>Bride Name (Arabic)</label><input type="text" id="brideAr" placeholder="اسم العروس"></div>
      <div class="form-group"><label>Bride Name (English)</label><input type="text" id="brideEn" placeholder="Bride Name"></div>
      <div class="form-group"><label>Groom Name (Arabic)</label><input type="text" id="groomAr" placeholder="اسم العريس"></div>
      <div class="form-group"><label>Groom Name (English)</label><input type="text" id="groomEn" placeholder="Groom Name"></div>
      <div class="form-group"><label>Venue / Hall Name</label><input type="text" id="venueName" placeholder="Grand Millennium Hall"></div>
      <div class="form-group"><label>Venue Location (Google Maps link or address)</label><input type="text" id="venueLocation" placeholder="https://maps.google.com/... or address"></div>
      <div class="form-group"><label>Event Date</label><input type="date" id="eventDate"></div>
      <div class="form-group"><label>Mobile Number</label><input type="tel" id="mobileNumber" placeholder="+20 123 456 789"></div>
      <div class="payment-section">
        <div style="margin-bottom:0.5rem; font-weight:600;">💳 Payment</div>
        <button id="instapayPaymentBtn" class="instapay-payment-btn"><span>📱</span> Pay with InstaPay</button>
        <div style="font-size:0.65rem; margin-top:0.6rem;">After payment, click "Submit Order"</div>
      </div>
      <button class="modal-btn" id="submitFinalBtn">✓ Submit Order</button>
    `;
    document.getElementById('instapayPaymentBtn').addEventListener('click', () => { window.open(INSTAPAY_PAYMENT_LINK, '_blank'); });
    document.getElementById('submitFinalBtn').addEventListener('click', () => submitOrder(totalAmount));
  }
  
  async function submitOrder(totalAmount) {
    const brideAr = document.getElementById('brideAr').value.trim();
    const brideEn = document.getElementById('brideEn').value.trim();
    const groomAr = document.getElementById('groomAr').value.trim();
    const groomEn = document.getElementById('groomEn').value.trim();
    const mobile = document.getElementById('mobileNumber').value.trim();
    const venueName = document.getElementById('venueName').value.trim();
    const venueLocation = document.getElementById('venueLocation').value.trim();
    const eventDate = document.getElementById('eventDate').value;
    const nameRegexAr = /^[\u0600-\u06FF\s]+$/;
    const nameRegexEn = /^[A-Za-z\s]+$/;
    if (!brideAr || !nameRegexAr.test(brideAr)) { await showGraphicDialog("Bride name (Arabic) must contain Arabic letters only.", "Validation Error"); return; }
    if (!brideEn || !nameRegexEn.test(brideEn)) { await showGraphicDialog("Bride name (English) must contain English letters only.", "Validation Error"); return; }
    if (!groomAr || !nameRegexAr.test(groomAr)) { await showGraphicDialog("Groom name (Arabic) must contain Arabic letters only.", "Validation Error"); return; }
    if (!groomEn || !nameRegexEn.test(groomEn)) { await showGraphicDialog("Groom name (English) must contain English letters only.", "Validation Error"); return; }
    if (!mobile || !venueName || !venueLocation || !eventDate) { await showGraphicDialog("All fields including venue, location, date are required.", "Missing Info"); return; }
    try {
      const orderRef = db.doc(`${ordersCollectionPath}/${currentOrderCode}`);
      await orderRef.update({
        coupleData: { brideAr, brideEn, groomAr, groomEn, mobile, venueName, venueLocation, eventDate },
        selectedStyle: catalog[currentIdx].name,
        selectedPrice: totalAmount,
        status: 'admin_pending',
        paymentMethod: 'InstaPay',
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      await showGraphicDialog("Order submitted! Admin will review within 24h. Complete payment via InstaPay. For inquiries: Instagram @digitalvows", "Order Received");
      modal.classList.remove('active');
      window.location.href = 'index.html';
    } catch(err) { await showGraphicDialog('Error: ' + err.message, "Submission Error"); }
  }
  
  function openModal() { modal.classList.add('active'); showVerifyScreen(); }
  function closeModal() { modal.classList.remove('active'); }
  
  document.getElementById("nextArrow").addEventListener("click", nextProduct);
  document.getElementById("prevArrow").addEventListener("click", prevProduct);
  document.getElementById("buyNowBtn").addEventListener("click", openModal);
  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });
  
  // Initial load
  window.addEventListener("DOMContentLoaded", () => {
    for(let i=0;i<catalog.length;i++) preloadVideo(catalog[i].video);
    updateDisplay(0);
    bgVideo.addEventListener('canplaythrough', () => { if(bgVideo.paused) bgVideo.play().catch(e=>null); });
  });
  
  // Small hint for users that audio will be enabled on first interaction
  setTimeout(() => {
    if (!audioUnlocked) {
      const hint = document.createElement('div');
      hint.style.position = 'fixed';
      hint.style.bottom = '20px';
      hint.style.left = '20px';
      hint.style.right = '20px';
      hint.style.background = 'rgba(0,0,0,0.7)';
      hint.style.backdropFilter = 'blur(10px)';
      hint.style.color = '#DBC6A5';
      hint.style.padding = '10px 16px';
      hint.style.borderRadius = '40px';
      hint.style.fontSize = '0.75rem';
      hint.style.textAlign = 'center';
      hint.style.zIndex = '999';
      hint.style.fontFamily = 'Inter, sans-serif';
      hint.style.border = '1px solid var(--accent-gold)';
      
      setTimeout(() => { hint.style.opacity = '0'; hint.style.transition = 'opacity 0.5s'; setTimeout(() => hint.remove(), 500); }, 4000);
      
      // Remove hint on first interaction as well
      const removeHint = () => { if(hint && hint.remove) hint.remove(); };
      document.addEventListener('click', removeHint, { once: true });
      document.addEventListener('touchstart', removeHint, { once: true });
    }
  }, 800);
</script>
</body>
</html>
