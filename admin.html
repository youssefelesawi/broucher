<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | DigitalVows</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(135deg, #0B0A0A 0%, #141211 100%); font-family: 'Inter', sans-serif; color: #EDEAE4; padding: 2rem; min-height: 100vh; }
    .container { max-width: 1400px; margin: 0 auto; }
    
    .header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    h1 { font-size: 2.5rem; font-weight: 700; background: linear-gradient(135deg, #F5E7D3, #DBC6A5); background-clip: text; -webkit-background-clip: text; color: transparent; letter-spacing: -0.5px; }
    .sub { color: #9E8F7C; margin-top: 0.5rem; font-size: 0.9rem; }
    .stats-btn { background: linear-gradient(135deg, #DBC6A5, #c9b084); color: #0B0A0A; border: none; padding: 0.7rem 1.5rem; border-radius: 60px; cursor: pointer; font-weight: 600; font-family: 'Inter', sans-serif; transition: 0.3s; }
    .stats-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(219,198,165,0.3); }
    
    /* Statistics Panel - separated beautifully */
    .stats-panel-wrapper { margin-bottom: 2rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .stat-card { background: rgba(20,18,17,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(219,198,165,0.2); border-radius: 24px; padding: 1.2rem; text-align: center; transition: 0.2s; }
    .stat-card:hover { border-color: rgba(219,198,165,0.5); transform: translateY(-2px); }
    .stat-card .stat-value { font-size: 2rem; font-weight: 700; color: #DBC6A5; }
    .stat-card .stat-label { font-size: 0.75rem; color: #9E8F7C; margin-top: 0.3rem; }
    .stat-card .stat-sub { font-size: 0.85rem; color: #DBC6A5; margin-top: 0.2rem; }
    .close-stats { background: transparent; border: 1px solid rgba(219,198,165,0.3); color: #DBC6A5; padding: 0.3rem 1rem; border-radius: 40px; cursor: pointer; font-size: 0.7rem; margin-top: 0.5rem; float: right; }
    
    .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; background: rgba(20,18,17,0.4); backdrop-filter: blur(10px); border-radius: 60px; padding: 0.4rem; width: fit-content; border: 1px solid rgba(219,198,165,0.2); flex-wrap: wrap; }
    .tab-btn { background: transparent; border: none; color: #B8AA9A; font-size: 0.9rem; font-weight: 500; cursor: pointer; padding: 0.7rem 1.5rem; transition: all 0.3s ease; border-radius: 60px; font-family: 'Inter', sans-serif; }
    .tab-btn.active { background: rgba(219,198,165,0.25); color: #F5E7D3; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .card { background: rgba(20,18,17,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(219,198,165,0.25); border-radius: 28px; padding: 1.8rem; margin-bottom: 1.5rem; }
    .card h3 { font-size: 1.3rem; font-weight: 600; color: #F5E7D3; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; color: #DBC6A5; font-size: 0.8rem; font-weight: 500; }
    input, select { width: 100%; padding: 0.9rem 1rem; background: rgba(0,0,0,0.5); border: 1px solid rgba(219,198,165,0.25); border-radius: 16px; color: #EDEAE4; font-family: inherit; font-size: 0.9rem; }
    input:focus, select:focus { outline: none; border-color: #DBC6A5; }
    .btn-primary { background: linear-gradient(135deg, #DBC6A5, #c9b084); color: #0B0A0A; border: none; padding: 0.9rem 2rem; border-radius: 60px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.3s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(219,198,165,0.3); }
    .btn-secondary { background: rgba(219,198,165,0.15); border: 1px solid rgba(219,198,165,0.4); color: #DBC6A5; padding: 0.5rem 1rem; border-radius: 40px; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
    .btn-secondary:hover { background: rgba(219,198,165,0.25); }
    .btn-success { background: linear-gradient(135deg, #2a7a3b, #1e5a2c); color: white; border: none; padding: 0.5rem 1rem; border-radius: 40px; cursor: pointer; font-size: 0.75rem; }
    .orders-table { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 1rem 0.8rem; color: #DBC6A5; font-weight: 600; font-size: 0.8rem; border-bottom: 1px solid rgba(219,198,165,0.2); }
    td { padding: 1rem 0.8rem; border-bottom: 1px solid rgba(219,198,165,0.1); font-size: 0.85rem; }
    .badge { display: inline-block; padding: 0.25rem 0.8rem; border-radius: 40px; font-size: 0.7rem; font-weight: 600; }
    .badge-pending { background: rgba(255,193,7,0.2); color: #ffc107; }
    .badge-admin-pending { background: rgba(219,198,165,0.2); color: #DBC6A5; }
    .badge-completed { background: rgba(40,167,69,0.2); color: #28a745; }
    .badge-paid { background: rgba(40,167,69,0.2); color: #28a745; }
    .badge-unpaid { background: rgba(255,193,7,0.2); color: #ffc107; }
    .code-display { background: linear-gradient(135deg, rgba(219,198,165,0.15), rgba(0,0,0,0.3)); border-radius: 20px; padding: 1.5rem; margin-top: 1.5rem; text-align: center; }
    .code-display strong { font-size: 2rem; font-family: monospace; color: #EBD9B9; display: block; margin: 0.5rem 0; }
    .copy-btn { background: rgba(219,198,165,0.2); border: 1px solid rgba(219,198,165,0.5); color: #DBC6A5; padding: 0.4rem 1rem; border-radius: 40px; cursor: pointer; }
    .custom-dialog-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(16px); z-index: 10000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
    .custom-dialog-overlay.active { opacity: 1; visibility: visible; }
    .custom-dialog { background: rgba(25,23,22,0.98); border: 1px solid rgba(219,198,165,0.5); border-radius: 40px; padding: 2rem; max-width: 500px; width: 90%; text-align: center; }
    .custom-dialog h3 { color: #F5E7D3; margin-bottom: 1rem; }
    .custom-dialog .dialog-buttons { display: flex; gap: 1rem; justify-content: center; margin-top: 1rem; }
    .custom-dialog button { background: #DBC6A5; border: none; padding: 0.7rem 1.5rem; border-radius: 40px; font-weight: 600; cursor: pointer; margin: 0; }
    .custom-dialog .btn-secondary-dialog { background: rgba(219,198,165,0.2); color: #DBC6A5; }
    .detail-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 10001; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
    .detail-modal-overlay.active { opacity: 1; visibility: visible; }
    .detail-modal { background: rgba(20,18,17,0.98); border: 1px solid rgba(219,198,165,0.4); border-radius: 32px; padding: 2rem; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .detail-modal .detail-row { margin-bottom: 0.8rem; padding: 0.5rem 0; border-bottom: 1px solid rgba(219,198,165,0.1); }
    .detail-modal .detail-label { font-weight: 600; color: #DBC6A5; font-size: 0.75rem; text-transform: uppercase; }
    .detail-modal .detail-value { color: #EDEAE4; font-size: 0.9rem; word-break: break-word; }
    .detail-close { float: right; background: none; border: none; color: #DBC6A5; font-size: 1.5rem; cursor: pointer; }
    .discount-note { font-size: 0.7rem; color: #9E8F7C; margin-top: 0.5rem; text-align: center; }
    @media (max-width: 768px) { body { padding: 1rem; } th, td { font-size: 0.7rem; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1>Admin Dashboard</h1><div class="sub">Manage orders, track payments, and apply percentage discounts</div></div>
    <button class="stats-btn" id="statsBtn">📊 Statistics & Reports</button>
  </div>
  
  <!-- Statistics Panel - Separate toggleable section -->
  <div id="statsPanelWrapper" class="stats-panel-wrapper" style="display:none;">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 0.5rem;">
      <button class="close-stats" id="closeStatsBtn">✕ Close Stats</button>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>
  
  <div class="tabs">
    <button class="tab-btn active" data-tab="orders">📋 Orders Management</button>
    <button class="tab-btn" data-tab="create">➕ Create New Order</button>
    <button class="tab-btn" data-tab="discounts">🏷️ Discount (% off)</button>
  </div>
  
  <div id="ordersPanel" class="tab-panel"><div class="card"><h3>📋 All Client Orders</h3><div class="orders-table" id="ordersList"><div style="padding:2rem; text-align:center;">Loading orders...</div></div></div></div>
  <div id="createPanel" class="tab-panel" style="display:none;"><div class="card"><h3>✨ Create New Order</h3>
    <div class="form-group"><label>Instagram Username</label><input type="text" id="instagramUser" placeholder="username"></div>
    <button class="btn-primary" id="createOrderBtn">✨ Generate Order Code</button>
    <div id="generatedCode" class="code-display" style="display:none;"></div>
  </div></div>
  <div id="discountsPanel" class="tab-panel" style="display:none;"><div class="card"><h3>🏷️ Apply Percentage Discount to Order</h3>
    <div class="form-group"><label>Order Code</label><input type="text" id="discountOrderCode" placeholder="Vows-XXXXXX"></div>
    <div class="form-group"><label>Discount Percentage (%)</label><input type="number" id="discountPercent" placeholder="e.g., 10 for 10% off" step="0.1" min="0" max="100"></div>
    <div class="form-group"><label>Discount Reason</label><input type="text" id="discountReason" placeholder="e.g., Special promotion, seasonal sale"></div>
    <button class="btn-primary" id="applyDiscountBtn">Apply % Discount</button>
    <div class="discount-note">※ Discount is calculated as percentage off the final total amount</div>
  </div></div>
</div>

<div class="custom-dialog-overlay" id="globalDialog"><div class="custom-dialog"><h3 id="dialogTitle"></h3><p id="dialogMessage"></p><div class="dialog-buttons"><button id="dialogConfirmBtn">OK</button></div></div></div>
<div class="detail-modal-overlay" id="detailModal"><div class="detail-modal"><button class="detail-close" id="detailCloseBtn">&times;</button><div id="detailContent"></div></div></div>

<script>
  const firebaseConfig = { apiKey: "AIzaSyDEnumhUfiYWvdGUIC1PEYbx7YgwRml_yc", authDomain: "digitalvows.firebaseapp.com", projectId: "digitalvows", storageBucket: "digitalvows.firebasestorage.app", messagingSenderId: "981576681165", appId: "1:981576681165:web:73498f764062de4e0a4b84" };
  firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
  const MAIN_DOC_ID = "digitalvows_main";
  const mainDocRef = db.collection('app_data').doc(MAIN_DOC_ID);
  
  const dialogOverlay = document.getElementById("globalDialog");
  const detailModalOverlay = document.getElementById("detailModal");
  const dialogTitle = document.getElementById("dialogTitle");
  const dialogMessage = document.getElementById("dialogMessage");
  const dialogConfirmBtn = document.getElementById("dialogConfirmBtn");
  
  function showDialog(message, title = "Notice") {
    dialogTitle.innerText = title;
    dialogMessage.innerText = message;
    dialogOverlay.classList.add("active");
    return new Promise((resolve) => {
      const handler = () => { dialogOverlay.classList.remove("active"); dialogConfirmBtn.removeEventListener("click", handler); resolve(); };
      dialogConfirmBtn.addEventListener("click", handler, { once: true });
    });
  }
  
  function showConfirmDialog(message, title = "Confirm") {
    return new Promise((resolve) => {
      dialogTitle.innerText = title;
      dialogMessage.innerText = message;
      const originalHTML = document.querySelector(".custom-dialog .dialog-buttons").innerHTML;
      document.querySelector(".custom-dialog .dialog-buttons").innerHTML = `<button id="dialogConfirmYes">Yes</button><button id="dialogConfirmNo" class="btn-secondary-dialog">Cancel</button>`;
      dialogOverlay.classList.add("active");
      const yesBtn = document.getElementById("dialogConfirmYes");
      const noBtn = document.getElementById("dialogConfirmNo");
      const cleanup = () => {
        dialogOverlay.classList.remove("active");
        document.querySelector(".custom-dialog .dialog-buttons").innerHTML = originalHTML;
        yesBtn?.removeEventListener("click", yesHandler);
        noBtn?.removeEventListener("click", noHandler);
      };
      const yesHandler = () => { cleanup(); resolve(true); };
      const noHandler = () => { cleanup(); resolve(false); };
      yesBtn.addEventListener("click", yesHandler);
      noBtn.addEventListener("click", noHandler);
    });
  }
  
  function generateRandomCode() { 
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; 
    let random = ''; 
    for (let i = 0; i < 6; i++) random += chars[Math.floor(Math.random() * chars.length)]; 
    return 'Vows-' + random; 
  }
  
  function copyToClipboard(text) { navigator.clipboard.writeText(text).then(() => showDialog("Copied!")); }
  
  // Calculate net amount after percentage discount
  function calculateNetAfterDiscount(originalAmount, discountPercent) {
    if (!discountPercent || discountPercent <= 0) return originalAmount;
    return originalAmount * (1 - discountPercent / 100);
  }
  
  async function showStatistics() {
    try {
      const snapshot = await mainDocRef.collection('orders').get();
      const orders = [];
      snapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
      
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const thisWeekStart = new Date(now.setDate(now.getDate() - now.getDay())).setHours(0,0,0,0);
      const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
      
      let totalOrders = orders.length;
      let totalGrossRevenue = 0; // sum of finalTotal (original total after customization)
      let totalDiscountAmount = 0;
      let totalNetRevenue = 0;
      let paidNetRevenue = 0;
      let pendingNetRevenue = 0;
      
      let todayOrders = 0, todayNetRevenue = 0;
      let weekOrders = 0, weekNetRevenue = 0;
      let monthOrders = 0, monthNetRevenue = 0;
      
      orders.forEach(order => {
        const originalAmount = order.finalTotal || order.selectedPrice || 0;
        const discountPercent = order.discountPercent || 0;
        const discountAmountValue = order.discountAmountValue || 0;
        const netAmount = originalAmount - discountAmountValue;
        
        totalGrossRevenue += originalAmount;
        totalDiscountAmount += discountAmountValue;
        totalNetRevenue += netAmount;
        
        if (order.paymentStatus === 'paid') paidNetRevenue += netAmount;
        else pendingNetRevenue += netAmount;
        
        const createdAt = order.createdAt?.toDate ? order.createdAt.toDate().getTime() : (order.timestamp?.toDate().getTime() || 0);
        if (createdAt >= today) { todayOrders++; todayNetRevenue += netAmount; }
        if (createdAt >= thisWeekStart) { weekOrders++; weekNetRevenue += netAmount; }
        if (createdAt >= thisMonthStart) { monthOrders++; monthNetRevenue += netAmount; }
      });
      
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="stat-value">${totalOrders}</div><div class="stat-label">Total Orders</div></div>
        <div class="stat-card"><div class="stat-value">$${totalGrossRevenue.toFixed(2)}</div><div class="stat-label">Gross Revenue (before discount)</div></div>
        <div class="stat-card"><div class="stat-value">$${totalDiscountAmount.toFixed(2)}</div><div class="stat-label">Total Discounts Given</div></div>
        <div class="stat-card"><div class="stat-value">$${totalNetRevenue.toFixed(2)}</div><div class="stat-label">Net Revenue (after discount)</div></div>
        <div class="stat-card"><div class="stat-value">$${paidNetRevenue.toFixed(2)}</div><div class="stat-label">Paid Amount (Net)</div></div>
        <div class="stat-card"><div class="stat-value">$${pendingNetRevenue.toFixed(2)}</div><div class="stat-label">Pending (Net)</div></div>
        <div class="stat-card"><div class="stat-value">${todayOrders}</div><div class="stat-label">Today Orders</div><div class="stat-sub">$${todayNetRevenue.toFixed(2)}</div></div>
        <div class="stat-card"><div class="stat-value">${weekOrders}</div><div class="stat-label">This Week</div><div class="stat-sub">$${weekNetRevenue.toFixed(2)}</div></div>
        <div class="stat-card"><div class="stat-value">${monthOrders}</div><div class="stat-label">This Month</div><div class="stat-sub">$${monthNetRevenue.toFixed(2)}</div></div>
      `;
      document.getElementById('statsPanelWrapper').style.display = 'block';
    } catch(err) { showDialog("Error loading stats: " + err.message); }
  }
  
  async function loadOrders() {
    const ordersList = document.getElementById('ordersList');
    ordersList.innerHTML = '<div style="padding:2rem; text-align:center;">Loading orders...</div>';
    try {
      const snapshot = await mainDocRef.collection('orders').orderBy('createdAt', 'desc').get();
      if (snapshot.empty) { ordersList.innerHTML = '<div style="padding:2rem; text-align:center;">No orders yet.</div>'; return; }
      let html = `<table><thead><tr><th>Code</th><th>Instagram</th><th>Status</th><th>Payment</th><th>Gross</th><th>Discount</th><th>Net</th><th>Created</th><th>Actions</th></tr></thead><tbody>`;
      snapshot.forEach(doc => {
        const d = doc.data();
        let statusClass = 'badge-pending';
        if (d.status === 'admin_pending') statusClass = 'badge-admin-pending';
        else if (d.status === 'completed') statusClass = 'badge-completed';
        let paymentClass = d.paymentStatus === 'paid' ? 'badge-paid' : 'badge-unpaid';
        let paymentText = d.paymentStatus === 'paid' ? 'Paid' : 'Unpaid';
        const grossAmount = (d.finalTotal || d.selectedPrice || 0);
        const discountPercent = d.discountPercent || 0;
        const discountAmountValue = d.discountAmountValue || 0;
        const netAmount = grossAmount - discountAmountValue;
        html += `<tr>
          <td><code>${d.code || doc.id}</code></td>
          <td>${escapeHtml(d.instagram || '-')}</td>
          <td><span class="badge ${statusClass}">${d.status || 'pending'}</span></td>
          <td><span class="badge ${paymentClass}" id="payment-badge-${doc.id}">${paymentText}</span><br>
            <button class="btn-secondary" style="margin-top:4px;" onclick="togglePaymentStatus('${doc.id}')">Toggle</button>
           </td>
          <td>$${grossAmount.toFixed(2)}</td>
          <td>${discountPercent > 0 ? discountPercent+'% ($${discountAmountValue.toFixed(2)})' : '-'}</td>
          <td><strong>$${netAmount.toFixed(2)}</strong></td>
          <td>${d.createdAt ? new Date(d.createdAt.toDate()).toLocaleDateString() : '-'}</td>
          <td><button class="btn-secondary view-details" data-id="${doc.id}">View</button>
          ${d.status === 'admin_pending' ? `<button class="btn-success complete-btn" data-id="${doc.id}">Complete</button>` : ''}</td>
         </tr>`;
      });
      html += '</tbody></table>';
      ordersList.innerHTML = html;
      document.querySelectorAll('.view-details').forEach(btn => btn.addEventListener('click', async () => await showOrderDetails(btn.dataset.id)));
      document.querySelectorAll('.complete-btn').forEach(btn => btn.addEventListener('click', async () => await completeOrder(btn.dataset.id)));
    } catch(err) { ordersList.innerHTML = `<div style="padding:2rem; color:#E8A0A0;">Error: ${err.message}</div>`; }
  }
  
  async function togglePaymentStatus(orderId) {
    const doc = await mainDocRef.collection('orders').doc(orderId).get();
    const current = doc.data().paymentStatus;
    const newStatus = current === 'paid' ? 'unpaid' : 'paid';
    await mainDocRef.collection('orders').doc(orderId).update({ paymentStatus: newStatus, paymentUpdatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    await showDialog(`Payment status changed to ${newStatus.toUpperCase()}`, "Updated");
    loadOrders();
  }
  
  // Apply percentage discount to order
  async function applyPercentageDiscount() {
    const code = document.getElementById('discountOrderCode').value.trim();
    const percent = parseFloat(document.getElementById('discountPercent').value);
    const reason = document.getElementById('discountReason').value.trim();
    if (!code) { showDialog("Enter order code"); return; }
    if (isNaN(percent) || percent < 0 || percent > 100) { showDialog("Enter valid percentage between 0 and 100"); return; }
    if (!reason) { showDialog("Please enter a reason for the discount"); return; }
    try {
      const orderRef = mainDocRef.collection('orders').doc(code);
      const doc = await orderRef.get();
      if (!doc.exists) { showDialog("Order not found"); return; }
      const orderData = doc.data();
      const originalAmount = orderData.finalTotal || orderData.selectedPrice || 0;
      const discountAmountValue = originalAmount * (percent / 100);
      await orderRef.update({ 
        discountPercent: percent, 
        discountReason: reason, 
        discountAmountValue: discountAmountValue,
        discountAppliedAt: firebase.firestore.FieldValue.serverTimestamp() 
      });
      await showDialog(`${percent}% discount applied to order ${code} ($${discountAmountValue.toFixed(2)} off)\nReason: ${reason}\nNew net amount: $${(originalAmount - discountAmountValue).toFixed(2)}`, "Discount Applied");
      document.getElementById('discountOrderCode').value = '';
      document.getElementById('discountPercent').value = '';
      document.getElementById('discountReason').value = '';
      loadOrders();
    } catch(err) { showDialog("Error: " + err.message); }
  }
  
  async function showOrderDetails(orderId) {
    try {
      const doc = await mainDocRef.collection('orders').doc(orderId).get();
      const d = doc.data();
      const originalAmount = (d.finalTotal || d.selectedPrice || 0);
      const discountPercent = d.discountPercent || 0;
      const discountAmountVal = d.discountAmountValue || 0;
      const netAmount = originalAmount - discountAmountVal;
      let html = `<h3>📄 Complete Order Details</h3>
        <div class="detail-row"><div class="detail-label">Order Code</div><div class="detail-value"><code>${d.code || orderId}</code></div></div>
        <div class="detail-row"><div class="detail-label">Instagram</div><div class="detail-value">@${escapeHtml(d.instagram || '-')}</div></div>
        <div class="detail-row"><div class="detail-label">Status</div><div class="detail-value">${d.status || 'pending'}</div></div>
        <div class="detail-row"><div class="detail-label">Payment Status</div><div class="detail-value">${d.paymentStatus === 'paid' ? '✅ Paid' : '⏳ Unpaid'}</div></div>
        <div class="detail-row"><div class="detail-label">Discount</div><div class="detail-value">${discountPercent > 0 ? discountPercent+'% off ($${discountAmountVal.toFixed(2)} saved)' : 'No discount applied'} ${d.discountReason ? '<br>Reason: '+escapeHtml(d.discountReason) : ''}</div></div>`;
      
      if (d.customizationData) {
        html += `<div class="detail-row"><div class="detail-label">Customization</div><div class="detail-value">
          • Intro: ${escapeHtml(d.customizationData.intro?.name)} ($${d.customizationData.intro?.price || 0})<br>
          • Background: ${escapeHtml(d.customizationData.background?.name)} ($${d.customizationData.background?.price || 0})<br>
          • Music: ${escapeHtml(d.customizationData.music?.name)} (${d.customizationData.music?.price ? '$'+d.customizationData.music.price : 'Free'})
        </div></div>`;
      }
      
      if (d.coupleData) {
        html += `<div class="detail-row"><div class="detail-label">Couple Info</div><div class="detail-value">
          👰 Bride: ${escapeHtml(d.coupleData.brideAr)} (${escapeHtml(d.coupleData.brideEn)})<br>
          🤵 Groom: ${escapeHtml(d.coupleData.groomAr)} (${escapeHtml(d.coupleData.groomEn)})<br>
          📱 Mobile: ${escapeHtml(d.coupleData.mobile)}<br>
          🏛️ Venue: ${escapeHtml(d.coupleData.venueName)}<br>
          📍 Location: ${escapeHtml(d.coupleData.venueLocation)}<br>
          📅 Event Date: ${escapeHtml(d.coupleData.eventDate)}
        </div></div>`;
      }
      
      html += `<div class="detail-row"><div class="detail-label">Financial</div><div class="detail-value">
        Original Amount: $${originalAmount.toFixed(2)}<br>
        Discount: ${discountPercent}% ( -$${discountAmountVal.toFixed(2)} )<br>
        <strong>Net Amount: $${netAmount.toFixed(2)}</strong>
      </div></div>`;
      
      html += `<div class="detail-row"><div class="detail-label">Created</div><div class="detail-value">${d.createdAt ? new Date(d.createdAt.toDate()).toLocaleString() : '-'}</div></div>`;
      if (d.completedAt) html += `<div class="detail-row"><div class="detail-label">Completed</div><div class="detail-value">${new Date(d.completedAt.toDate()).toLocaleString()}</div></div>`;
      showDetailModal(html);
    } catch(err) { showDialog("Error: " + err.message); }
  }
  
  async function completeOrder(orderId) {
    const confirmed = await showConfirmDialog("Mark order as COMPLETED? This will finalize the order.");
    if (confirmed) {
      try {
        await mainDocRef.collection('orders').doc(orderId).update({ status: 'completed', completedAt: firebase.firestore.FieldValue.serverTimestamp() });
        await showDialog("Order completed successfully!");
        loadOrders();
      } catch(err) { showDialog("Error: " + err.message); }
    }
  }
  
  document.getElementById('createOrderBtn').addEventListener('click', async () => {
    const instagram = document.getElementById('instagramUser').value.trim();
    if (!instagram) { showDialog("Enter Instagram username"); return; }
    const code = generateRandomCode();
    try {
      await mainDocRef.collection('orders').doc(code).set({ code, instagram, status: 'pending', paymentStatus: 'unpaid', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      const codeDiv = document.getElementById('generatedCode');
      codeDiv.style.display = 'block';
      codeDiv.innerHTML = `✅ Order Created!<strong>${code}</strong><button class="copy-btn" id="copyCodeBtn">Copy Code</button>`;
      document.getElementById('copyCodeBtn')?.addEventListener('click', () => copyToClipboard(code));
      document.getElementById('instagramUser').value = '';
      await showDialog(`Order ${code} created. Share with client.`);
      loadOrders();
      setTimeout(() => codeDiv.style.display = 'none', 8000);
    } catch(err) { showDialog('Error: ' + err.message); }
  });
  
  document.getElementById('applyDiscountBtn').addEventListener('click', applyPercentageDiscount);
  document.getElementById('statsBtn').addEventListener('click', () => { showStatistics(); setTimeout(() => { document.getElementById('statsPanelWrapper').scrollIntoView({ behavior: 'smooth' }); }, 100); });
  document.getElementById('closeStatsBtn').addEventListener('click', () => { document.getElementById('statsPanelWrapper').style.display = 'none'; });
  
  function showDetailModal(content) {
    document.getElementById("detailContent").innerHTML = content;
    detailModalOverlay.classList.add("active");
  }
  document.getElementById("detailCloseBtn").addEventListener("click", () => detailModalOverlay.classList.remove("active"));
  detailModalOverlay.addEventListener("click", (e) => { if(e.target === detailModalOverlay) detailModalOverlay.classList.remove("active"); });
  
  function escapeHtml(str) { if (!str) return '-'; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
  
  document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('ordersPanel').style.display = tab === 'orders' ? 'block' : 'none';
    document.getElementById('createPanel').style.display = tab === 'create' ? 'block' : 'none';
    document.getElementById('discountsPanel').style.display = tab === 'discounts' ? 'block' : 'none';
    if (tab === 'orders') loadOrders();
  }));
  
  // Make togglePaymentStatus globally accessible
  window.togglePaymentStatus = togglePaymentStatus;
  loadOrders();
</script>
</body>
</html>
